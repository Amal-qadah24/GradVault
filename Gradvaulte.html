<!DOCTYPE html>
<html lang="en">
<head>
    <!-- gradvault-build:6 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradVault | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <main class="login-container">

        <!-- Left: brand -->
        <section class="brand-section">
            <img src="image/cfb44c0c-25e2-4d2b-98bd-57812180bb26.png"
                 alt="GradVault Logo"
                 class="brand-logo">

            <p class="brand-tagline">Smart Archiving for<br>Graduation Projects</p>
        </section>

        <!-- Right: login form -->
        <section class="login-section">
            <form id="loginForm" novalidate>
                <h1>Welcome back</h1>
                <p class="subtitle">Log in to your account</p>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="name@student.birzeit.edu"
                           autocomplete="email" required>
                    <p class="error" id="emailError" role="alert"></p>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password"
                               placeholder="Enter your password"
                               autocomplete="current-password" required>
                        <button type="button" class="toggle-password"
                                id="togglePassword" aria-label="Show password">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                                 stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <p class="error" id="passwordError" role="alert"></p>
                </div>

                <a href="forgot-password.html" class="forgot-password">Forgot password?</a>

                <p class="form-message" id="formMessage" role="status"></p>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-label">Log in</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>

                <p class="signup-text">
                    Don't have an account?
                    <a href="register.html">Register here</a>
                </p>
            </form>
        </section>

    </main>

    <script src="script.js?v=5"></script>
</body>
</html>
