<!DOCTYPE html>
<html lang="en">
<head>
    <!-- gradvault-build:6 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradVault | Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <main class="login-container">

        <section class="brand-section">
            <img src="image/cfb44c0c-25e2-4d2b-98bd-57812180bb26.png"
                 alt="GradVault Logo"
                 class="brand-logo">
            <p class="brand-tagline">Smart Archiving for<br>Graduation Projects</p>
        </section>

        <section class="login-section">
            <form id="forgotForm" novalidate>
                <h1>Forgot your password?</h1>
                <p class="subtitle">Enter your email and we will send you a link to reset it</p>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="name@student.birzeit.edu"
                           autocomplete="email" required>
                    <p class="error" id="emailError" role="alert"></p>
                </div>

                <p class="form-message" id="formMessage" role="status"></p>

                <button type="submit" class="btn-login" id="submitBtn">
                    <span class="btn-label">Send reset link</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>

                <p class="signup-text"><a href="Gradvaulte.html">&larr; Back to login</a></p>
            </form>
        </section>

    </main>

    <script src="recover.js?v=5"></script>
</body>
</html>
